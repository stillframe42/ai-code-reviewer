# 로컬 개발 환경 PostgreSQL 설정
# username/password는 application-secret.yml에 설정한다 (절대 이 파일에 작성하지 말 것)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/aireviewer}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true   # 기존 DB(Flyway 이력 없음)를 자동으로 baseline 처리
    baseline-version: 1         # 기존 DB는 V1로 stamping → V2부터 실행
