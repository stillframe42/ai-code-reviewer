# Langfuse LLM Observability 설정
# 실제 API Key는 application-secret.yml에서 주입됩니다.
langfuse:
  host: ${LANGFUSE_HOST:http://localhost:3000}
  enabled: true
  ingest-timeout: 3s

spring:
  ai:
    chat:
      observations:
        # LLM 호출 관찰 시 프롬프트/응답 전문을 Observation에 포함
        include-prompt: true
        include-completion: true
