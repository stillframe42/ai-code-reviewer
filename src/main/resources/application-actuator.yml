management:
  server:
    port: 9001                    # 메인 API(8080)와 분리 — 내부망 전용. 8081 은 Python 에이전트 컨테이너가 사용
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
      group:
        python-agent:
          include: pythonAgent
  health:
    python-agent:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
