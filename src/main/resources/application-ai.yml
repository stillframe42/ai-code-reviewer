# AI 관련 설정
# 실제 API 키는 application-secret.yml 또는 환경 변수에서 주입됩니다.
spring:
  ai:
    anthropic:
      api-key: ${anthropic.api-key}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 4096
    openai:
      api-key: ${openai.api-key}
      chat:
        options:
          max-tokens: 4096
