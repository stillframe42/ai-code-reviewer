# AI 관련 설정
# 실제 API 키는 application-secret.yml 또는 환경 변수에서 주입됩니다.

app:
  rag:
    chunk-size: 512
    min-chunk-size-chars: 100
    min-chunk-length-to-embed: 50
    max-num-chunks: 10000
    keep-separator: true
    auto-index: true
  review:
    diff:
      # 추가 제외 glob 패턴 목록 (빈 목록 = 추가 제외 없음)
      additional-exclude-patterns: []
      # max-tokens: 30000  # 주석 해제 시 토큰 한도 활성화 (null = 한도 없음)
    tool:
      # Tool Calling 최대 라운드트립 횟수 참고값 (Spring AI 2.0.0-M2 내장 제한 미지원 — 현재 60s 타임아웃이 안전망)
      max-roundtrips: 3
  ai:
    reviewer:
      default-model: claude-haiku-4-5-20251001   # 일반 PR 기본 모델
      critical-model: claude-sonnet-4-6           # 중요 PR 전용 모델
      critical-patterns:
        - "**/*Security*"
        - "**/*Auth*"
        - "**/migration/**"
        - "**/*Config*"
        - "build.gradle.kts"
      cache:
        ttl: PT1H    # java.time.Duration ISO-8601 형식, 1시간 TTL
    cost:
      models:
        claude-haiku-4-5-20251001:
          input-per-1k: 0.000800
          output-per-1k: 0.004000
        gpt-4o:
          input-per-1k: 0.005000
          output-per-1k: 0.015000
        gpt-4o-mini:
          input-per-1k: 0.000150
          output-per-1k: 0.000600
  prompt:
    review-system: classpath:prompts/review-system-v8.st   # v8: v7 기반 + Tool Calling 사용 지침 추가
    chat-system: classpath:prompts/chat-system.st
    chat-user: classpath:prompts/chat-user.st

spring:
  ai:
    anthropic:
      api-key: ${anthropic.api-key}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 4096
    openai:
      api-key: ${openai.api-key}
      chat:
        options:
          max-tokens: 4096
      embedding:
        options:
          model: text-embedding-3-small
