# AI 관련 설정
# 실제 API 키는 application-secret.yml 또는 환경 변수에서 주입됩니다.

app:
  rag:
    auto-index: true
    retry-base-delay: PT2S   # Exponential Backoff 기본 대기 시간 (2초)
    similarity-threshold: 0.0  # RRF 혼합 검색 후보 수집 단계 임계값 (0.0 = 필터링 없음, RRF가 품질 제어)
    compression:
      # 압축 LLM 모델명 — gpt-4o-mini로 OpenAI 키 재사용
      model: gpt-4o-mini
      # 청크 토큰 임계값 — 이하면 압축 우회 (Phase 1 인사이트)
      compression-threshold-tokens: 300
    evaluation:
      model: gpt-4o-mini
  review:
    diff:
      # 추가 제외 glob 패턴 목록 (빈 목록 = 추가 제외 없음)
      additional-exclude-patterns: []
      # max-tokens: 30000  # 주석 해제 시 토큰 한도 활성화 (null = 한도 없음)
    tool:
      # Tool Calling 최대 라운드트립 횟수 참고값 (Spring AI 2.0.0-M2 내장 제한 미지원 — 현재 60s 타임아웃이 안전망)
      max-roundtrips: 3
  ai:
    reviewer:
      default-model: claude-haiku-4-5-20251001   # 일반 PR 기본 모델
      critical-model: claude-sonnet-4-6           # 중요 PR 전용 모델
      critical-patterns:
        - "**/*Security*"
        - "**/*Auth*"
        - "**/migration/**"
        - "**/*Config*"
        - "build.gradle.kts"
      cache:
        ttl: PT1H        # java.time.Duration ISO-8601 형식, 1시간 TTL
        key-version: v1  # 키 prefix 버전 — 프롬프트/RAG 인덱스 변경 시 올려 기존 캐시 일괄 무효화
    cost:
      models:
        claude-haiku-4-5-20251001:
          input-per-1k: 0.000800
          output-per-1k: 0.004000
        gpt-4o:
          input-per-1k: 0.005000
          output-per-1k: 0.015000
        gpt-4o-mini:
          input-per-1k: 0.000150
          output-per-1k: 0.000600
  prompt:
    review-system: classpath:prompts/review/review-system-v13.st  # v13: v11 기반 + Few-shot 3 예시 (C-2 채택, 2026-04-24)
    chat-system: classpath:prompts/chat/chat-system.st
    chat-user: classpath:prompts/chat/chat-user.st

rag:
  enabled: true

spring:
  ai:
    anthropic:
      api-key: ${anthropic.api-key}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 4096
    openai:
      api-key: ${openai.api-key}
      chat:
        options:
          max-tokens: 4096
      embedding:
        options:
          model: text-embedding-3-small
