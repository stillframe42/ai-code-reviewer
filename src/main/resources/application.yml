server:
  port: 8080

logging:
  level:
    root: WARN
    stillframe42.aicodereviewer: INFO
    # diff 내용(전처리된 diff, AI 전달 내용) 확인 시 아래 주석 해제
    # stillframe42.aicodereviewer.review: DEBUG
    # Netty 4.2.x에서 macOS 네이티브 DNS 라이브러리 미지원으로 인한 오류 메시지 숨김
    # 실제 동작은 JVM 기본 DNS 폴백으로 정상 처리됨
    io.netty.resolver.dns.macos: OFF

app:
  review:
    diff:
      # 파일별 병렬 AI 호출 최대 동시 실행 수 — API rate limit 초과 방지 (기본: 3)
      max-concurrency: 3

spring:
  jackson:
    mapper:
      accept-case-insensitive-enums: true

  config:
    import:
      - classpath:application-db.yml          # DB 관련 설정
      - classpath:application-ai.yml          # AI 관련 설정
      - classpath:application-github.yml      # Github 관련 설정
      - classpath:application-langfuse.yml    # Langfuse LLM Observability 설정
      - classpath:application-actuator.yml        # Actuator 관리 포트 및 메트릭 설정
      - classpath:application-redis.yml        # Redis 연결 설정
      - optional:classpath:application-secret.yml  # 로컬 시크릿 (없어도 기동 가능)
