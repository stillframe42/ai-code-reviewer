server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:devdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:your-anthropic-api-key}
    openai:
      api-key: ${OPENAI_API_KEY:your-openai-api-key}
