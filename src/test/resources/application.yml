app:
  ai:
    cost:
      # application-ai.yml의 단가와 동기화 필요 — 단가 변경 시 두 파일 함께 수정
      models:
        claude-haiku-4-5-20251001:
          input-per-1k: 0.000800
          output-per-1k: 0.004000
        gpt-4o:
          input-per-1k: 0.005000
          output-per-1k: 0.015000
        gpt-4o-mini:
          input-per-1k: 0.000150
          output-per-1k: 0.000600
  prompt:
    review-system: classpath:prompts/review/review-system-v10.st
    chat-system: classpath:prompts/chat/chat-system.st
    chat-user: classpath:prompts/chat/chat-user.st
  review:
    diff:
      # 파일별 병렬 AI 호출 최대 동시 실행 수 — main application.yml과 동일
      max-concurrency: 3
      # 추가 제외 glob 패턴 — main application-ai.yml과 동일
      additional-exclude-patterns: []
    tool:
      # Tool Calling 최대 라운드트립 횟수 — main application-ai.yml과 동일
      max-roundtrips: 3

langfuse:
  enabled: false   # 테스트 기본값 — Langfuse 전송 비활성화 (LangfuseObservationVerificationTest에서 true로 오버라이드)

logging:
  level:
    # macOS 네이티브 DNS 라이브러리 미지원 오류 메시지 숨김 — main application.yml과 동일
    io.netty.resolver.dns.macos: OFF

spring:
  jackson:
    mapper:
      # enum 대소문자 무관 파싱 — main application.yml과 동일
      accept-case-insensitive-enums: true

  config:
    import:
      - classpath:application-db.yml     # 테스트용 DB 설정
      - classpath:application-github.yml # GitHub 설정 (기본값 사용)
      - classpath:application-agent.yml  # 원격 에이전트 클라이언트 설정 (WebClient 빈 placeholder 해석용)

  # 환경변수가 있으면 실제 키 사용, 없으면 더미 키 폴백 (실제 AI 호출 스킵됨)
  # application-ai.yml을 import하지 않으므로 모델 설정을 여기서 명시 (미설정 시 Spring AI 기본값 사용)
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:test-dummy-key}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 4096
    openai:
      api-key: ${OPENAI_API_KEY:test-dummy-key}
      chat:
        options:
          max-tokens: 4096
