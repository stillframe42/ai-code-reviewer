# 통합 테스트 전용 설정
# spring.datasource.*, github.api.base-url, spring.ai.*.base-url은
# AbstractIntegrationTest의 @DynamicPropertySource가 런타임에 덮어씀

anthropic:
  api-key: test-dummy-key

openai:
  api-key: test-dummy-key

github:
  app:
    app-id: 1
    webhook-secret: test-webhook-secret
    private-key-path: src/test/resources/test-keys/rsa-test-key.pem

spring:
  autoconfigure:
    exclude: []   # application-db.yml의 PgVectorStore 제외 해제 — Testcontainers에서 실제 사용
  ai:
    retry:
      # 통합 테스트에서 AI 오류 시나리오 소요 시간을 줄이기 위해 Spring AI 자체 재시도 비활성화
      # SpringAiReviewAdapter의 재시도(MAX_ATTEMPTS=2)만 사용
      max-attempts: 1
    vectorstore:
      # application-db.yml의 pgvector 설정과 동기화 필요 — dimensions/index-type 변경 시 두 파일 함께 수정
      pgvector:
        initialize-schema: false   # Testcontainers DB에서 Flyway가 스키마 관리
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
  datasource:
    # driver-class-name은 H2 설정(application-db.yml)을 PostgreSQL로 오버라이드
    # URL/username/password는 AbstractIntegrationTest @DynamicPropertySource가 런타임에 덮어씀
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/placeholder  # @DynamicPropertySource가 덮어씀
    username: placeholder                              # @DynamicPropertySource가 덮어씀
    password: placeholder                             # @DynamicPropertySource가 덮어씀
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    # 신규 Testcontainers DB이므로 baseline 불필요
    baseline-on-migrate: false
    enabled: true

langfuse:
  enabled: false
  host: http://localhost:9999   # 사용되지 않는 더미 주소
  secret-key: test-secret
  public-key: test-public

app:
  ai:
    reviewer:
      default-model: test-haiku-model
      critical-model: test-sonnet-model
      critical-patterns:
        - "**/*Security*"
        - "**/*Auth*"
        - "**/migration/**"
        - "**/*Config*"
        - "build.gradle.kts"
