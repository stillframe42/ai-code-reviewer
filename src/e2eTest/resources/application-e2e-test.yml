spring:
  config:
    activate:
      on-profile: e2e-test
  ai:
    openai:
      api-key: test
    anthropic:
      api-key: test

# trace 흐름 박제를 위해 enabled. host 는 DynamicPropertySource 가 WireMock 으로 override.
langfuse:
  public-key: test
  secret-key: test
  enabled: true

# Phase 2: webhook 서명 검증용 고정 secret. SecurityPrFixture.WEBHOOK_SECRET 과 동일해야 함.
github:
  app:
    webhook-secret: e2e-webhook-secret

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
