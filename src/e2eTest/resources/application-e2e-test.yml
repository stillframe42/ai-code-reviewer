spring:
  # IT 의 base 설정 (driver, autoconfigure, jpa, flyway, vectorstore 등) 재사용
  # — e2e 특수 설정만 본 파일에서 override (활성 profile 의 정의가 우선)
  config:
    import:
      - "classpath:application-integration-test.yml"
    activate:
      on-profile: e2e-test
  ai:
    openai:
      api-key: test
    anthropic:
      api-key: test

# trace 흐름 박제를 위해 enabled. host 는 DynamicPropertySource 가 WireMock 으로 override.
langfuse:
  public-key: test
  secret-key: test
  enabled: true

# Phase 2: webhook 서명 검증용 고정 secret. SecurityPrFixture.WEBHOOK_SECRET 과 동일해야 함.
github:
  app:
    webhook-secret: e2e-webhook-secret

# Remote 에이전트가 RAG context API 호출 시 X-Internal-Auth 헤더로 사용. RemoteAgentContainer 의 INTERNAL_AUTH_TOKEN env 와 동일해야 함.
agent:
  remote:
    callback:
      internal-auth-token: e2e-internal-auth-token

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
