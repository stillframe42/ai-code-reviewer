openapi: 3.1.0
info:
  title: AI Code Reviewer API
  description: GitHub PR 자동 코드 리뷰를 위한 AI 기반 REST API
  version: 0.0.1

servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

tags:
  - name: chat
    description: AI 채팅 API
  - name: review
    description: AI 코드 리뷰 API

paths:
  /api/chat:
    post:
      tags:
        - chat
      summary: AI에게 메시지 전송
      description: 지정된 AI 프로바이더에게 메시지를 전송하고 응답을 반환합니다. provider 생략 시 기본값은 ANTHROPIC입니다.
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: "이 코드를 리뷰해줘"
              provider: "ANTHROPIC"
      responses:
        '200':
          description: AI 응답 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              example:
                answer: "코드를 분석한 결과..."
        '400':
          description: 잘못된 요청 (유효성 검증 실패 또는 요청 본문 파싱 오류)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  summary: 필드 유효성 검증 실패
                  value:
                    message: "메시지를 입력해주세요"
                parseError:
                  summary: 요청 본문 파싱 오류
                  value:
                    error: "요청 본문을 읽을 수 없습니다. 필드 누락 또는 타입 오류를 확인해주세요"
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "서버 오류가 발생했습니다"

  /api/chat/stream:
    post:
      tags:
        - chat
      summary: AI에게 메시지 전송 (SSE 스트리밍)
      description: 지정된 AI 프로바이더에게 메시지를 전송하고 토큰 단위로 SSE 스트리밍 응답을 반환합니다. provider 생략 시 기본값은 ANTHROPIC입니다.
      operationId: chatStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              message: "이 코드를 리뷰해줘"
              provider: "ANTHROPIC"
      responses:
        '200':
          description: SSE 스트리밍 성공 (토큰 단위 응답)
          content:
            text/event-stream:
              schema:
                type: string
              example: "data: 코드를\n\ndata: 분석한\n\ndata: 결과...\n\n"
        '400':
          description: 잘못된 요청 (유효성 검증 실패 또는 요청 본문 파싱 오류)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  summary: 필드 유효성 검증 실패
                  value:
                    message: "메시지를 입력해주세요"
                parseError:
                  summary: 요청 본문 파싱 오류
                  value:
                    error: "요청 본문을 읽을 수 없습니다. 필드 누락 또는 타입 오류를 확인해주세요"
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "서버 오류가 발생했습니다"

  /api/review:
    post:
      tags:
        - review
      summary: 코드 구조화 리뷰 요청
      description: 코드를 분석하여 점수, 요약, 이슈 목록, 긍정 평가를 포함한 구조화된 JSON 리뷰 결과를 반환합니다. provider 생략 시 기본값은 ANTHROPIC입니다.
      operationId: reviewCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
            examples:
              simpleCode:
                summary: 일반 코드 리뷰
                value:
                  code: "fun add(a: Int, b: Int) = a + b"
                  provider: "ANTHROPIC"
              prDiff:
                summary: PR diff 전처리 적용
                value:
                  code: "diff --git a/Foo.kt b/Foo.kt\n--- a/Foo.kt\n+++ b/Foo.kt\n@@ -1 +1 @@\n-old\n+new"
                  provider: "ANTHROPIC"
                  diffOptions:
                    filterTestFiles: true
                    filterLockFiles: true
                    additionalExcludePatterns: ["generated/**"]
                    contextLines: 0
      responses:
        '200':
          description: 구조화된 코드 리뷰 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeReviewResult'
              example:
                overall_score: 8
                summary: "간단하고 명확한 덧셈 함수입니다. 특별한 문제는 없습니다."
                issues: []
                positives:
                  - "단일 표현식 함수로 간결하게 작성되었습니다"
                  - "파라미터 타입이 명시적으로 선언되었습니다"
        '400':
          description: 잘못된 요청 (유효성 검증 실패 또는 요청 본문 파싱 오류)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  summary: 필드 유효성 검증 실패
                  value:
                    code: "코드를 입력해주세요"
                parseError:
                  summary: 요청 본문 파싱 오류
                  value:
                    error: "요청 본문을 읽을 수 없습니다. 필드 누락 또는 타입 오류를 확인해주세요"
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "서버 오류가 발생했습니다"

components:
  schemas:
    AiProvider:
      type: string
      enum: [ANTHROPIC, OPENAI]
      default: ANTHROPIC
      description: "AI 응답 프로바이더. 생략 시 기본값은 ANTHROPIC"
      example: "ANTHROPIC"

    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          description: AI에게 전송할 메시지 (공백 불가)
          example: "이 코드를 리뷰해줘"
        provider:
          $ref: '#/components/schemas/AiProvider'

    ChatResponse:
      type: object
      required:
        - answer
      properties:
        answer:
          type: string
          description: AI의 응답 메시지
          example: "코드를 분석한 결과..."

    ValidationErrorResponse:
      type: object
      description: 필드별 유효성 검증 오류 응답 (필드명을 키로, 오류 메시지를 값으로 가지는 Map)
      additionalProperties:
        type: string
      example:
        message: "메시지를 입력해주세요"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: 오류 메시지
          example: "서버 오류가 발생했습니다"

    ReviewRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 1
          description: 리뷰할 코드 또는 PR diff 문자열 (공백 불가)
          example: "fun add(a: Int, b: Int) = a + b"
        provider:
          $ref: '#/components/schemas/AiProvider'
        diffOptions:
          $ref: '#/components/schemas/DiffFilterOptions'

    DiffFilterOptions:
      type: object
      description: PR diff 전처리 옵션. 제공 시 AI 전달 전 불필요한 청크·줄을 제거하여 토큰을 절감한다. 생략 시 전처리 없이 raw code 전달.
      properties:
        filterTestFiles:
          type: boolean
          default: true
          description: "테스트 파일(*Test.kt, *Spec.kt 등) 제외 여부"
          example: true
        filterLockFiles:
          type: boolean
          default: true
          description: "잠금 파일(*.lock, package-lock.json 등) 제외 여부"
          example: true
        additionalExcludePatterns:
          type: array
          items:
            type: string
          default: []
          description: "추가 제외 glob 패턴 목록 (예: generated/**, **/*.pb.go)"
          example: ["generated/**", "**/*.pb.go"]
        contextLines:
          type: integer
          minimum: 0
          default: 3
          description: "변경 전후 유지할 context 줄 수. 0이면 +/- 줄만 전송 (최대 절감), 3이면 기본 unified diff 수준"
          example: 0

    IssueSeverity:
      type: string
      enum: [CRITICAL, MAJOR, MINOR, SUGGESTION]
      description: "이슈 심각도. CRITICAL(운영 장애/보안 취약점), MAJOR(잠재적 버그/성능 저하), MINOR(컨벤션/가독성), SUGGESTION(선택적 개선)"
      example: "MAJOR"

    IssueCategory:
      type: string
      enum: [PERFORMANCE, SECURITY, READABILITY, ARCHITECTURE]
      description: "이슈 카테고리. PERFORMANCE(성능), SECURITY(보안), READABILITY(가독성), ARCHITECTURE(아키텍처)"
      example: "PERFORMANCE"

    CodeIssue:
      type: object
      required:
        - id
        - category
        - severity
        - description
        - suggestion
      properties:
        id:
          type: string
          description: 이슈 식별자 ('ISSUE-1', 'ISSUE-2' 형식)
          example: "ISSUE-1"
        category:
          $ref: '#/components/schemas/IssueCategory'
        line:
          type: integer
          nullable: true
          description: 이슈가 발생한 라인 번호. 특정할 수 없으면 null
          example: 3
        severity:
          $ref: '#/components/schemas/IssueSeverity'
        description:
          type: string
          description: 이슈에 대한 한국어 설명
          example: "변수명이 너무 짧아 의도를 파악하기 어렵습니다"
        suggestion:
          type: string
          description: 구체적인 개선 방법 또는 수정 코드 예시
          example: "a, b 대신 firstNumber, secondNumber와 같이 명확한 이름을 사용하세요"

    CodeReviewResult:
      type: object
      required:
        - overall_score
        - summary
        - issues
        - positives
      properties:
        overall_score:
          type: integer
          minimum: 1
          maximum: 10
          description: 전반적인 코드 품질 점수 (1~10, 10이 최고)
          example: 8
        summary:
          type: string
          description: 코드 전반에 대한 한국어 총평 요약
          example: "간단하고 명확한 덧셈 함수입니다. 특별한 문제는 없습니다."
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CodeIssue'
          description: 발견된 이슈 목록. 이슈가 없으면 빈 배열
        positives:
          type: array
          items:
            type: string
          description: 코드의 잘된 점 목록 (한국어). 없으면 빈 배열
          example:
            - "단일 표현식 함수로 간결하게 작성되었습니다"
