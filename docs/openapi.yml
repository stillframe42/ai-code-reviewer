openapi: 3.1.0
info:
  title: AI Code Reviewer API
  description: Spring AI 기반 AI 코드 리뷰 자동화 시스템 API
  version: 1.0.0

tags:
  - name: review
    description: AI 코드 리뷰 엔드포인트
  - name: webhook
    description: GitHub Webhook 수신 엔드포인트
  - name: reviews
    description: 리뷰 조회 엔드포인트
  - name: rag
    description: RAG 컨텍스트 조회 엔드포인트 (내부용)

paths:
  /api/review:
    post:
      operationId: reviewCode
      summary: AI 코드 리뷰
      description: |
        코드(또는 Git diff)를 AI에 전달하여 구조화된 코드 리뷰 결과를 반환합니다.
        `diffOptions`를 지정하면 테스트 파일·잠금 파일 필터링, context 줄 수 조절 등 diff 전처리가 적용됩니다.
      tags:
        - review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
            example:
              code: |
                fun divide(a: Int, b: Int): Int {
                    return a / b
                }
              provider: ANTHROPIC
              diffOptions:
                filterTestFiles: true
                filterLockFiles: true
                additionalExcludePatterns:
                  - "**/generated/**"
                contextLines: 3
                maxTokens: 8000
                strategyOverrides:
                  "docs/**": "Skip"
                  "infra/**": "QueryReview"
      responses:
        '200':
          description: 코드 리뷰 결과 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeReview'
              example:
                overall_score: 5
                summary: "기본 동작은 올바르나 0으로 나누기 예외 처리가 누락되어 있습니다."
                issues:
                  - id: "issue-1"
                    category: SECURITY
                    line: 2
                    severity: MAJOR
                    description: "b가 0일 때 ArithmeticException이 발생합니다."
                    suggestion: "b == 0 검사를 추가하거나 require(b != 0)을 사용하세요."
                positives:
                  - "함수 시그니처가 명확합니다."
        '400':
          description: 요청 유효성 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                errors:
                  code: "코드를 입력해주세요"
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "AI로부터 리뷰 결과를 받지 못했습니다"

  /api/reviews/{owner}/{repo}/{prNumber}:
    get:
      operationId: getReviewByPr
      summary: PR 리뷰 조회
      description: 특정 PR의 최신 AI 코드 리뷰 결과를 조회합니다.
      tags:
        - reviews
      parameters:
        - in: path
          name: owner
          required: true
          schema:
            type: string
          description: 레포지토리 소유자
          example: "octocat"
        - in: path
          name: repo
          required: true
          schema:
            type: string
          description: 레포지토리 이름
          example: "Hello-World"
        - in: path
          name: prNumber
          required: true
          schema:
            type: integer
          description: PR 번호
          example: 42
      responses:
        '200':
          description: 리뷰 결과 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSummaryResponse'
              example:
                repoFullName: "octocat/Hello-World"
                prNumber: 42
                headSha: "abc123def456"
                status: DONE
                createdAt: "2026-03-31T10:00:00Z"
                completedAt: "2026-03-31T10:00:30Z"
                summary: "전반적으로 양호한 코드입니다."
                issueCount: 2
                toolCallCount: 3
                modelName: "claude-sonnet-4-6"
        '404':
          description: 해당 PR의 리뷰 결과 없음

  /api/reviews/stats:
    get:
      operationId: getReviewStats
      summary: 리뷰 통계 조회
      description: 전체 리뷰 건수, 카테고리별 이슈 분포, 평균 Tool 호출 횟수, 모델별 비용, 캐시 히트율, 추정 절감액을 반환합니다.
      tags:
        - reviews
      responses:
        '200':
          description: 통계 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStatsResponse'
              example:
                totalReviews: 42
                categoryDistribution:
                  SECURITY: 15
                  PERFORMANCE: 8
                  READABILITY: 12
                  ARCHITECTURE: 5
                averageToolCallCount: 2.8
                costByModel:
                  claude-sonnet-4-6: 0.004521
                  claude-haiku-4-5: 0.000128
                cacheHitRate: 0.72
                estimatedSavings: 0.003255

  /api/github/webhook:
    post:
      operationId: handleGitHubWebhook
      summary: GitHub Webhook 수신
      description: |
        GitHub App Webhook 이벤트를 수신합니다.
        X-Hub-Signature-256 헤더로 HMAC-SHA256 서명을 검증하며,
        pull_request 이벤트(opened, synchronize, reopened)에 대해 AI 코드 리뷰를 비동기로 실행합니다.
        처리는 fire-and-forget 방식이므로 즉시 202를 반환합니다.
      tags:
        - webhook
      parameters:
        - in: header
          name: X-Hub-Signature-256
          required: true
          schema:
            type: string
          description: "HMAC-SHA256 서명 (형식: sha256=<hex>)"
          example: "sha256=abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
        - in: header
          name: X-GitHub-Event
          required: true
          schema:
            type: string
          description: "GitHub 이벤트 타입 (예: pull_request, ping)"
          example: "pull_request"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubWebhookPayload'
            example:
              action: "opened"
              installation:
                id: 12345678
              repository:
                full_name: "owner/repo"
              pull_request:
                number: 42
                head:
                  sha: "abc123def456"
      responses:
        '202':
          description: Webhook 수신 완료, AI 코드 리뷰 비동기 처리 시작 (pull_request 이벤트)
        '200':
          description: Webhook 수신 완료, 처리 없이 무시 (지원하지 않는 이벤트 타입 또는 action)
        '401':
          description: HMAC-SHA256 서명 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Webhook 서명 검증에 실패했습니다"

  /api/rag/context/{contextId}:
    get:
      operationId: getRagContext
      summary: RAG 컨벤션 컨텍스트 단건 조회 (내부용)
      description: |
        에이전트가 contextIds lazy fetch 시 호출한다.
        X-Internal-Auth 헤더 필수 — INTERNAL_AGENT_CALLBACK_TOKEN 과 일치해야 함.
      tags:
        - rag
      parameters:
        - name: contextId
          in: path
          required: true
          schema:
            type: string
          example: "a1b2c3d4-e5f6-7890-abcd-ef0123456789"
        - name: X-Internal-Auth
          in: header
          required: true
          description: 내부 인증 토큰 (INTERNAL_AGENT_CALLBACK_TOKEN 환경변수 값)
          schema:
            type: string
      responses:
        '200':
          description: 컨텍스트 단건 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagContextResponse'
              example:
                content: "코드 컨벤션 청크 본문..."
        '401':
          description: X-Internal-Auth 누락 또는 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "unauthorized"
        '404':
          description: contextId 미존재 또는 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "contextId=a1b2... not found"

components:
  schemas:
    # ── 요청 스키마 ──────────────────────────────────────────────────────────

    ReviewRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 1
          description: 리뷰할 코드 또는 Git diff 문자열
          example: "fun add(a: Int, b: Int) = a + b"
        provider:
          $ref: '#/components/schemas/AiProvider'
        diffOptions:
          $ref: '#/components/schemas/DiffFilterOptions'
        reviewMode:
          $ref: '#/components/schemas/ReviewModeRequest'
        installationId:
          type: integer
          format: int64
          nullable: true
          description: "WITH_TOOLS 모드에서 GitHub App Installation ID (필수)"
          example: 12345678

    ReviewModeRequest:
      type: string
      enum:
        - WITHOUT_TOOLS
        - WITH_TOOLS
      default: WITHOUT_TOOLS
      description: "Tool Calling 활성화 여부. WITHOUT_TOOLS(기본): diff만으로 리뷰. WITH_TOOLS: GitHub API Tool 자동 호출 포함 리뷰."
      example: WITHOUT_TOOLS

    DiffFilterOptions:
      type: object
      description: PR diff 전처리 옵션 — AI에 전달하기 전 불필요한 파일·줄을 제거하는 동작을 제어합니다.
      properties:
        filterTestFiles:
          type: boolean
          default: true
          description: 테스트 파일(*Test.kt, *Spec.kt 등) 제외 여부
        filterLockFiles:
          type: boolean
          default: true
          description: 잠금 파일(*.lock, package-lock.json 등) 제외 여부
        additionalExcludePatterns:
          type: array
          items:
            type: string
          default: []
          description: 사용자 정의 추가 제외 glob 패턴 목록
          example: ["**/generated/**", "**/*.pb.go"]
        contextLines:
          type: integer
          default: 3
          minimum: 0
          description: 변경 전후 유지할 context 줄 수 (0 = +/- 줄만)
        maxTokens:
          type: integer
          nullable: true
          default: null
          minimum: 1
          description: 최대 허용 토큰 수 — 초과 시 변경량이 적은 파일 청크부터 제거 (null = 한도 없음)
          example: 8000
        strategyOverrides:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FileReviewStrategy'
          default: {}
          description: |
            파일별 리뷰 전략 오버라이드 — FileExtensionClassifier의 자동 분류보다 우선 적용됩니다.
            키: glob 패턴 (예: "src/main/kotlin/**"), 값: FileReviewStrategy
          example:
            "docs/**": "Skip"
            "src/main/kotlin/**": "FullReview"

    # ── 응답 스키마 ──────────────────────────────────────────────────────────

    CodeReview:
      type: object
      required:
        - overall_score
        - summary
        - issues
        - positives
      properties:
        overall_score:
          type: integer
          minimum: 1
          maximum: 10
          description: 코드 전체 품질 점수 (1 = 최하, 10 = 최상)
        summary:
          type: string
          description: 코드 리뷰 총평
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CodeIssue'
          description: 발견된 이슈 목록
        positives:
          type: array
          items:
            type: string
          description: 잘 작성된 부분 목록

    CodeIssue:
      type: object
      required:
        - id
        - category
        - severity
        - description
        - suggestion
      properties:
        id:
          type: string
          description: 이슈 고유 식별자
          example: "issue-1"
        category:
          $ref: '#/components/schemas/IssueCategory'
        line:
          type: integer
          nullable: true
          description: 이슈가 발생한 줄 번호 (특정 줄을 지목할 수 없는 경우 null)
        severity:
          $ref: '#/components/schemas/IssueSeverity'
        description:
          type: string
          description: 이슈 설명
        suggestion:
          type: string
          description: 개선 제안

    FileReviewStrategy:
      type: string
      enum:
        - FullReview
        - QueryReview
        - Skip
      description: |
        파일별 AI 리뷰 처리 전략:
        - `FullReview`: 일반 코드 품질 리뷰 (기본값 — .kt, .java, .ts 등)
        - `QueryReview`: 변경 의도·설정값 위주 리뷰 (.yml, .sql, .json, Dockerfile 등)
        - `Skip`: 리뷰 대상에서 완전히 제외 (이미지, 바이너리, 빌드 산출물 등)

    # ── 공통 열거형 ──────────────────────────────────────────────────────────

    AiProvider:
      type: string
      enum:
        - ANTHROPIC
        - OPENAI
      default: ANTHROPIC
      description: 사용할 AI 프로바이더

    IssueSeverity:
      type: string
      enum:
        - CRITICAL
        - MAJOR
        - MINOR
        - SUGGESTION
      description: |
        이슈 심각도:
        - `CRITICAL`: 운영 장애 / 보안 취약점 — 즉시 수정 필수
        - `MAJOR`: 잠재적 버그 / 성능 저하 — 머지 전 수정 권고
        - `MINOR`: 컨벤션 / 가독성 — 수정 권장
        - `SUGGESTION`: 선택적 개선 / 리팩토링 아이디어

    IssueCategory:
      type: string
      enum:
        - PERFORMANCE
        - SECURITY
        - READABILITY
        - ARCHITECTURE
      description: |
        이슈 카테고리:
        - `PERFORMANCE`: N+1 쿼리, 비효율적 시간복잡도, 캐싱 누락
        - `SECURITY`: SQL Injection, 인증/인가 누락, 민감정보 노출
        - `READABILITY`: 불명확한 네이밍, 함수 길이 초과, 매직넘버
        - `ARCHITECTURE`: SRP 위반, 레이어 의존성 역전, 과도한 결합

    GitHubWebhookPayload:
      type: object
      description: GitHub pull_request Webhook 페이로드
      required:
        - action
        - installation
        - repository
        - pull_request
      properties:
        action:
          type: string
          description: "PR 이벤트 액션 타입 (opened, synchronize, reopened 등)"
          example: "opened"
        installation:
          type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              description: GitHub App 설치 ID
              example: 12345678
        repository:
          type: object
          required:
            - full_name
          properties:
            full_name:
              type: string
              description: "레포지토리 전체 이름 (owner/repo 형식)"
              example: "octocat/Hello-World"
        pull_request:
          type: object
          required:
            - number
            - head
          properties:
            number:
              type: integer
              description: PR 번호
              example: 42
            head:
              type: object
              required:
                - sha
              properties:
                sha:
                  type: string
                  description: 최신 커밋 SHA
                  example: "abc123def456"

    ReviewRequestStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - DONE
        - FAILED
      description: |
        리뷰 요청 처리 상태:
        - `PENDING`: 요청 접수, 처리 대기
        - `PROCESSING`: AI 리뷰 실행 중
        - `DONE`: 리뷰 완료
        - `FAILED`: 리뷰 실패

    ReviewSummaryResponse:
      type: object
      required:
        - repoFullName
        - prNumber
        - headSha
        - status
        - createdAt
        - issueCount
        - toolCallCount
      properties:
        repoFullName:
          type: string
          description: "레포지토리 전체 이름 (owner/repo 형식)"
          example: "octocat/Hello-World"
        prNumber:
          type: integer
          description: PR 번호
          example: 42
        headSha:
          type: string
          description: 리뷰 시점의 커밋 SHA
          example: "abc123def456"
        status:
          $ref: '#/components/schemas/ReviewRequestStatus'
        createdAt:
          type: string
          format: date-time
          description: 리뷰 요청 생성 시각
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 리뷰 완료/실패 시각
        summary:
          type: string
          nullable: true
          description: AI 리뷰 총평
        issueCount:
          type: integer
          description: 발견된 이슈 수
          example: 3
        toolCallCount:
          type: integer
          description: AI 리뷰 중 실행된 Tool 호출 횟수
          example: 2
        modelName:
          type: string
          nullable: true
          description: 리뷰에 사용된 AI 모델명
          example: "claude-sonnet-4-6"

    ReviewStatsResponse:
      type: object
      required:
        - totalReviews
        - categoryDistribution
        - averageToolCallCount
        - costByModel
        - cacheHitRate
        - estimatedSavings
      properties:
        totalReviews:
          type: integer
          format: int64
          description: 전체 리뷰 요청 수
          example: 42
        categoryDistribution:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: 카테고리별 이슈 수 (PERFORMANCE, SECURITY, READABILITY, ARCHITECTURE)
          example:
            SECURITY: 15
            PERFORMANCE: 8
            READABILITY: 12
            ARCHITECTURE: 5
        averageToolCallCount:
          type: number
          format: double
          description: 리뷰당 평균 Tool 호출 횟수
          example: 2.8
        costByModel:
          type: object
          additionalProperties:
            type: number
          description: 모델별 누적 LLM 비용 합계 (USD, BigDecimal)
          example:
            claude-sonnet-4-6: 0.004521
            claude-haiku-4-5: 0.000128
        cacheHitRate:
          type: number
          format: double
          description: 캐시 히트율 (0.0~1.0)
          example: 0.72
        estimatedSavings:
          type: number
          description: 캐시로 인한 추정 비용 절감액 (USD, BigDecimal)
          example: 0.003255

    # ── 에러 응답 ────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      description: 단일 메시지 오류 응답
      required:
        - error
      properties:
        error:
          type: string
          description: 오류 메시지

    ValidationErrorResponse:
      type: object
      description: 필드별 유효성 검증 오류 응답
      required:
        - errors
      properties:
        errors:
          type: object
          additionalProperties:
            type: string
          description: 필드명 → 오류 메시지 맵
          example:
            message: "메시지를 입력해주세요"
            code: "코드를 입력해주세요"

    # ── Agent 관련 스키마 ────────────────────────────────────────────────────

    AgentAnalysisRequest:
      type: object
      description: 에이전트로 전달하는 분석 요청 페이로드
      required:
        - diff
        - context_ids
      properties:
        diff:
          type: string
          description: 분석 대상 Git diff 문자열
          example: "diff --git a/src/main.kt b/src/main.kt\n..."
        context_ids:
          type: array
          items:
            type: string
          description: pgvector vector_store row id 목록. 에이전트가 lazy fetch 로 본문 조회.
          example:
            - "a1b2c3d4-e5f6-7890-abcd-ef0123456789"
            - "b2c3d4e5-f6a7-8901-bcde-f01234567890"
        session_id:
          type: string
          nullable: true
          description: |
            Langfuse 세션 식별자 — Spring Boot 의 reviewRequestId.toString() 을 그대로 사용한다.
            Python 측은 이 값을 Langfuse CallbackHandler 의 session_id 로 부착해
            Spring Boot trace 와 같은 세션으로 묶는다. null 이면 Python 로컬 analysis_id 로 fallback.
          example: "42"

    # ── RAG 관련 스키마 ──────────────────────────────────────────────────────

    RagContextResponse:
      type: object
      required:
        - content
      properties:
        content:
          type: string
