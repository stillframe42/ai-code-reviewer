global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'ai-code-reviewer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9001']

  - job_name: 'ai-agent-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8081']
