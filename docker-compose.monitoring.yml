services:
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: aireviewer-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    container_name: aireviewer-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.0
    container_name: aireviewer-tempo
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200"   # Tempo HTTP API / 쿼리
      - "4317:4317"   # OTLP gRPC 수신
      - "4318:4318"   # OTLP HTTP 수신
    restart: unless-stopped

  ai-agent-service:
    build:
      context: ../ai-agent-service
    container_name: aireviewer-agent
    ports:
      - "8081:8081"
    env_file:
      - ../ai-agent-service/.env
    environment:
      # 컨테이너 네트워크 기준으로 .env 값을 덮어쓴다
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      SPRING_BOOT_URL: http://host.docker.internal:8080
    depends_on:
      - tempo
    restart: unless-stopped

volumes:
  grafana-data:
