services:
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: aireviewer-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    container_name: aireviewer-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.0
    container_name: aireviewer-tempo
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "127.0.0.1:3200:3200"   # Tempo HTTP API / 쿼리
      - "127.0.0.1:4317:4317"   # OTLP gRPC 수신
      - "127.0.0.1:4318:4318"   # OTLP HTTP 수신
    restart: unless-stopped

volumes:
  grafana-data:
