services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aireviewer-postgres
    environment:
      POSTGRES_DB: aireviewer
      POSTGRES_USER: aireviewer
      POSTGRES_PASSWORD: aireviewer
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d   # 초기화 스크립트 마운트
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireviewer -d aireviewer"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  langfuse-server:
    image: langfuse/langfuse:2
    container_name: aireviewer-langfuse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://aireviewer:aireviewer@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
      TELEMETRY_ENABLED: "false"

  redis:
    image: redis:7-alpine
    container_name: aireviewer-redis
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-agent-service:
    build: ../ai-agent-service
    container_name: aireviewer-agent
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      # Spring Boot 의 INTERNAL_AGENT_CALLBACK_TOKEN 과 동일 값을 공유해야 callback 인증 통과
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AGENT_CALLBACK_TOKEN}
      # 미설정 시 Python 측 Langfuse 콜백 비활성 — Spring Boot 와의 통합 세션 trace 검증에 필수
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      SPRING_BOOT_URL: http://host.docker.internal:8080
      MAX_AGENT_STEPS: 10
      # 미설정 시 빈 값 → Python 측 OpenTelemetry 계측 비활성 (collector 없는 환경 보호)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
    driver: local
