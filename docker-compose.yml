services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aireviewer-postgres
    environment:
      POSTGRES_DB: aireviewer
      POSTGRES_USER: aireviewer
      POSTGRES_PASSWORD: aireviewer
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d   # 초기화 스크립트 마운트
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aireviewer -d aireviewer"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  langfuse-server:
    image: langfuse/langfuse:2
    container_name: aireviewer-langfuse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://aireviewer:aireviewer@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
      TELEMETRY_ENABLED: "false"

  redis:
    image: redis:7-alpine
    container_name: aireviewer-redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-agent-service:
    build: ../ai-agent-service
    container_name: aireviewer-agent
    ports:
      - "8081:8081"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SPRING_BOOT_URL: http://host.docker.internal:8080
      MAX_AGENT_STEPS: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
    driver: local
